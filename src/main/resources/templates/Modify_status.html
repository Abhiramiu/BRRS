<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
	<link rel="stylesheet" type="text/css"
		href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.0/css/bootstrap.min.css">
	<link rel="stylesheet" type="text/css"
		href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.9.0/css/all.min.css">
	<link rel="stylesheet" type="text/css"
		href="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.css">
	<link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap4.min.css">
	<link rel="shortcut icon" th:href="@{/favicon.ico}" type="image/x-icon">
	<link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">
	<link rel="stylesheet" th:href="@{/css/CustomButton.css}" />

	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.0/js/bootstrap.min.js"></script>
	<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
	<script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap4.min.js"></script>

	<style>
		.row1 {
			padding-bottom: 10px;
		}

		table.dataTable thead th,
		table.dataTable tfoot th {
			font-weight: normal;
		}

		table.table .thead-light th {
			font-size: 13px;
			border-color: #d4d7da;
		}

		.dataTables_scrollBody {
			overflow: unset !important;
		}

		.dataTables_wrapper .dataTables_paginate .paginate_button {
			padding: 0px;
		}

		#userAuditLevelTb thead th {
			background-color: #37474F;
			color: white;
			font-weight: bold;
			font-size: 13px;
			text-align: left;
			border: 1px solid #dee2e6;
		}

		#userAuditLevelTb tbody td {
			text-align: left;
			border: 1px solid #dee2e6;
			font-size: 13px;
		}

		#userAuditLevelTb tbody tr:nth-child(odd) {
			background-color: #f9f9f9;
		}

		.dataTables_empty {
			color: red !important;
			text-align: left;
		}

		.dataTables_wrapper .dataTables_paginate .paginate_button {
			padding: 4px 8px;
			margin: 2px;
			border: 1px solid #ccc;
			background-color: #3d69fc;
			border-radius: 4px;
			font-size: 12px;
		}

		.table-container {
			max-height: 500px;
			overflow-y: auto;
			margin-top: 10px;
		}

		table.dataTable thead th {
			background-color: #37474F;
			color: white;
			font-weight: bold;
			font-size: 13px;
			text-align: left;
			border: 1px solid #dee2e6;
			white-space: nowrap;
		}

		table.dataTable tbody td {
			text-align: left;
			border: 1px solid #dee2e6;
			font-size: 13px;
		}

		/* Color styling for Select and Deselect headers/options */
		.select-header {
			color: #28a745 !important;
			font-weight: bold;
		}

		.deselect-header {
			color: #dc3545 !important;
			font-weight: bold;
		}

		.status-badge {
			cursor: pointer;
		}

		.custom-alert-overlay {
			display: none;
			position: fixed;
			z-index: 9999;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(0, 0, 0, 0.45);
			justify-content: center;
			align-items: center;
		}

		.custom-alert-box {
			width: 380px;
			max-width: 90%;
			background: #ffffff;
			border-radius: 8px;
			box-shadow: 0 5px 25px rgba(0, 0, 0, 0.3);
			overflow: hidden;
			animation: popupEffect 0.25s ease-in-out;
		}

		.custom-alert-header {
			background-color: #6B7A8F;
			color: white;
			padding: 14px 18px;
			font-size: 17px;
			font-weight: bold;
			text-align: center;
		}

		.custom-alert-body {
			padding: 25px 20px;
			text-align: center;
			font-size: 15px;
			color: #333;
		}

		.custom-alert-footer {
			padding: 12px;
			text-align: center;
			border-top: 1px solid #dee2e6;
		}

		.custom-alert-btn {
			background-color: #6B7A8F;
			color: white;
			border: 1px solid #6B7A8F;
			border-radius: 4px;
			padding: 7px 28px;
			cursor: pointer;
		}

		.custom-alert-btn:hover {
			background-color: white;
			color: #6B7A8F;
		}

		@keyframes popupEffect {
			from {
				opacity: 0;
				transform: scale(0.85);
			}

			to {
				opacity: 1;
				transform: scale(1);
			}
		}
	</style>

	<script th:inline="javascript">
		/*<![CDATA[*/

		let currentRowId = null;

		function goHome() {
			window.location.href = '/BRRS/Dashboard';
		}

		function goBack() {
			window.history.back();
		}

		function modifypopup(rowId) {
			currentRowId = rowId;

			const modal = document.getElementById('modifyModal');
			modal.classList.add('show');
			modal.style.display = 'block';
			document.body.classList.add('modal-open');

			const tableBody = document.getElementById('modalTableBody');
			tableBody.innerHTML = '<tr><td colspan="3" class="text-center p-4">Loading...</td></tr>';

			fetch('./details?id=' + rowId)
				.then(response => {
					if (!response.ok) {
						throw new Error('Failed to load data');
					}
					return response.json();
				})
				.then(data => {
					tableBody.innerHTML = '';

					if (!data || data.length === 0) {
						tableBody.innerHTML = '<tr><td colspan="3" class="text-center p-4">No modifications found.</td></tr>';
						return;
					}

					data.forEach(item => {
						const row = document.createElement('tr');
						row.innerHTML = `
						<td>${item.columnName || ''}</td>
						<td>${item.oldValue || ''}</td>
						<td>${item.newValue || ''}</td>
					`;
						tableBody.appendChild(row);
					});
				})
				.catch(error => {
					console.error(error);
					tableBody.innerHTML = '<tr><td colspan="3" class="text-center text-danger p-4">Failed to load data.</td></tr>';
				});
		}

		// Master Select All
		function selectAllRecords() {
			const rows = document.querySelectorAll('tr.userlist');
			let unverifiedFound = false;

			rows.forEach(row => {
				const selectRadio = row.querySelector('.row-select-radio');
				const deselectRadio = row.querySelector('.row-deselect-radio');

				if (selectRadio && !selectRadio.disabled) {
					selectRadio.checked = true;
					deselectRadio.checked = false;
					unverifiedFound = true;
				}
			});

			if (!unverifiedFound) {
				showCustomAlert("No unverified records available to select.");
			}
		}

		// Master Deselect All
		function deselectAllRecords() {
			const rows = document.querySelectorAll('tr.userlist');
			rows.forEach(row => {
				const selectRadio = row.querySelector('.row-select-radio');
				const deselectRadio = row.querySelector('.row-deselect-radio');

				if (deselectRadio && !deselectRadio.disabled) {
					selectRadio.checked = false;
					deselectRadio.checked = true;
				}
			});
		}

		function verifySelectedRecords() {
			const selectedRadios = document.querySelectorAll('.row-select-radio:checked');

			if (selectedRadios.length === 0) {
				showCustomAlert("Please select at least one record using the Select radio button to verify.");
				return;
			}

			let selectedIds = [];
			selectedRadios.forEach(radio => {
				// Only collect IDs from enabled (unverified) rows
				if (!radio.disabled) {
					selectedIds.push(radio.value);
				}
			});

			if (selectedIds.length === 0) {
				showCustomAlert("Please select valid unverified records to verify.");
				return;
			}

			showCustomConfirm(
				"Are you sure you want to verify and transfer " + selectedIds.length + " selected record(s)?",
				function () {
					fetch('./approveSelectedAuditRecords', {
						method: 'POST',
						headers: {
							'Content-Type': 'application/json'
						},
						body: JSON.stringify(selectedIds)
					})
						.then(response => {
							if (!response.ok) {
								throw new Error('Verification failed');
							}
							return response.text();
						})
						.then(data => {
							showCustomAlert(
								"Selected Reports Verified and Data Transferred Successfully!",
								function () {
									location.reload();
								}
							);
						})
						.catch(error => {
							console.error(error);
							showCustomAlert("Failed to verify and transfer selected reports.");
						});
				}
			);
		}

		function verifyRecord(rowId) {
			currentRowId = rowId;
			showCustomConfirm(
				"Are you sure you want to verify this record?",
				function () {
					fetch('./approveAuditRecord', {
						method: 'POST',
						headers: {
							'Content-Type': 'application/x-www-form-urlencoded'
						},
						body: 'id=' + encodeURIComponent(currentRowId)
					})
						.then(response => {
							if (!response.ok) {
								throw new Error('Verification failed');
							}
							return response.text();
						})
						.then(data => {
							showCustomAlert(
								"Report Verified and Data Transferred Successfully!",
								function () {
									location.reload();
								}
							);
						})
						.catch(error => {
							console.error(error);
							showCustomAlert("Failed to verify and transfer report.");
						});
				}
			);
		}

		function closeModal() {
			const modal = document.getElementById('modifyModal');
			modal.classList.remove('show');
			modal.style.display = 'none';
			document.body.classList.remove('modal-open');

			const backdrop = document.querySelector('.modal-backdrop');
			if (backdrop) {
				backdrop.remove();
			}
		}

		function showCustomAlert(message, onOk) {
			document.getElementById('customAlertMessage').textContent = message;
			const alertBox = document.getElementById('customAlert');
			const footer = alertBox.querySelector('.custom-alert-footer');

			footer.innerHTML = `<button type="button" class="custom-alert-btn" onclick="closeCustomAlert()">OK</button>`;

			const newOkButton = footer.querySelector('.custom-alert-btn');
			newOkButton.onclick = function () {
				closeCustomAlert();
				if (typeof onOk === 'function') {
					onOk();
				}
			};

			alertBox.style.display = 'flex';
		}

		function closeCustomAlert() {
			document.getElementById('customAlert').style.display = 'none';
		}

		function showCustomConfirm(message, onYes) {
			document.getElementById('customAlertMessage').textContent = message;
			const alertBox = document.getElementById('customAlert');
			const footer = alertBox.querySelector('.custom-alert-footer');

			footer.innerHTML = `
			<button type="button" class="custom-alert-btn" id="confirmYes">Yes, Verify</button>
			<button type="button" class="custom-alert-btn" id="confirmNo" style="margin-left:8px;">Cancel</button>
		`;

			alertBox.style.display = 'flex';

			document.getElementById('confirmYes').onclick = function () {
				closeCustomAlert();
				footer.innerHTML = `<button type="button" class="custom-alert-btn" onclick="closeCustomAlert()">OK</button>`;
				onYes();
			};

			document.getElementById('confirmNo').onclick = function () {
				closeCustomAlert();
				footer.innerHTML = `<button type="button" class="custom-alert-btn" onclick="closeCustomAlert()">OK</button>`;
			};
		}
		/*]]>*/
		document.addEventListener("DOMContentLoaded", function () {

			const rows = document.querySelectorAll("tr.userlist");
			let verifiedAbove = false;

			rows.forEach(row => {

				const isVerified = row.getAttribute("data-verified") === "true";

				const selectRadio = row.querySelector(".row-select-radio");
				const deselectRadio = row.querySelector(".row-deselect-radio");

				// Disable current row if already verified
				// Also disable rows below an already verified record
				if (verifiedAbove || isVerified) {

					if (selectRadio) {
						selectRadio.disabled = true;
					}

					if (deselectRadio) {
						deselectRadio.disabled = true;
					}
				}

				// Once a verified record is found,
				// disable selection for all subsequent rows
				if (isVerified) {
					verifiedAbove = true;
				}

			});

		});
	</script>
	<title>Verify Status</title>
</head>

<body>
	<div class="container-fluid">
		<div th:replace="~{HeaderMenu :: header}"></div>

		<div class="container-fluid">
			<div class="row">
				<div class="col-sm-12">
					<div class="card mt-5">
						<div class="card-header d-flex justify-content-between align-items-center"
							style="background-color: #6B7A8F;">
							<h4 style="color:white;font-weight: bold;font-size: 20px;padding-top: 5px;">MODIFY STATUS -
								VERIFICATION SCREEN</h4>
							<button type="button" class="btn btn-light btn-sm font-weight-bold"
								onclick="verifySelectedRecords()">
								<i class="fas fa-check text-success"></i> Verify Selected Record
							</button>
						</div>

						<div class="table-container">
							<table class="table table-striped table-bordered table-hover" id="usertable">
								<thead>
									<tr>
										<th>Entry User</th>
										<th>Table Name</th>
										<th style="text-align: center;">View</th>
										<th style="text-align: center;">Verify Status</th>
										<th style="text-align: center; white-space: nowrap;">
											<span class="select-header">Select</span>&nbsp;&nbsp;<input type="radio"
												name="masterToggle" onclick="selectAllRecords()" title="Select All"
												style="vertical-align: middle; accent-color: #28a745;" />
										</th>
										<th style="text-align: center; white-space: nowrap;">
											<span class="deselect-header">Deselect</span>&nbsp;&nbsp;<input type="radio"
												name="masterToggle" onclick="deselectAllRecords()" title="Deselect All"
												checked style="vertical-align: middle; accent-color: #dc3545;" />
										</th>
									</tr>
								</thead>
								<tbody>
									<tr th:each="auditdata : ${AuditListModify}" class="userlist"
										th:attr="data-verified=${not #strings.isEmpty(auditdata.auth_user)}">
										<td
											th:text="${(auditdata.entry_user ?: 'N/A') + ' / ' + (auditdata.entry_user_name ?: 'N/A')}">
										</td>
										<td th:text="${auditdata.audit_table ?: 'N/A'}"></td>

										<!-- View Column -->
										<td style="text-align: center;">
											<span style="cursor: pointer;"
												th:onclick="'modifypopup(\'' + ${auditdata.sno} + '\')'"
												title="View Details">
												<i class="fas fa-eye" style="color: rgb(0, 0, 0); font-size: 18px;"></i>
											</span>
										</td>

										<!-- Verify Status Column -->
										<td style="text-align: center;">
											<!-- Verified -->
											<span th:if="${not #strings.isEmpty(auditdata.auth_user)}"
												style="cursor: pointer;"
												onclick="showCustomAlert('This record is already verified!')"
												title="Verified">
												<i class="fas fa-check-circle"
													style="color: green; font-size: 18px;"></i>
											</span>

											<!-- Unverified -->
											<!--<span th:unless="${not #strings.isEmpty(auditdata.auth_user)}"
												style="cursor: pointer;"
												th:onclick="'verifyRecord(\'' + ${auditdata.sno} + '\')'"
												title="Unverified (Click to Verify)">
												<i class="fas fa-times-circle" style="color: red; font-size: 18px;"></i>
											</span>-->
											<span th:unless="${not #strings.isEmpty(auditdata.auth_user)}"
												style="cursor: pointer;"
												
												title="Unverified (Click to Verify)">
												<i class="fas fa-times-circle" style="color: red; font-size: 18px;"></i>
											</span>
										</td>

										<!-- Select Radio Column -->
										<td style="text-align: center;">
											<input type="radio" th:name="${'rowSelect_' + auditdata.sno}"
												class="row-select-radio" th:value="${auditdata.sno}"
												style="accent-color: #28a745;"
												th:disabled="${not #strings.isEmpty(auditdata.auth_user)}" />
										</td>

										<!-- Deselect Radio Column -->
										<td style="text-align: center;">
											<input type="radio" th:name="${'rowSelect_' + auditdata.sno}"
												class="row-deselect-radio" value="DESELECT" checked
												style="accent-color: #dc3545;"
												th:disabled="${not #strings.isEmpty(auditdata.auth_user)}" />
										</td>
									</tr>
								</tbody>
							</table>
						</div>

						<div class="card-footer text-center">
							<button type="button" class="custom-tab-btn" id="btnHome" onclick="goHome();">Home</button>
							<button type="button" class="custom-tab-btn" id="btnBack" onclick="goBack();">Back</button>
						</div>
					</div>
				</div>

				<!-- Modal -->
				<div class="modal fade" id="modifyModal" tabindex="-1" role="dialog" style="padding-top: 100px;">
					<div class="modal-dialog modal-dialog-centered modal-dialog-scrollable" style="max-width: 550px;">
						<div class="modal-content">

							<div class="menu-title-header" style="padding: 5px; background-color: #6b7a8f;">
								<div class="modal-title" style="text-align: center; color: white; font-weight: bold;">
									BRRS
								</div>
							</div>

							<div class="modal-body" style="text-align: center; padding: 20px; max-height: 500px">
								<table class="table table-bordered table-hover w-100 mb-4 text-left">
									<thead class="thead-light">
										<tr>
											<th>Field Name</th>
											<th>Old Value</th>
											<th>New Value</th>
										</tr>
									</thead>
									<tbody id="modalTableBody">
									</tbody>
								</table>
								<button type="button" class="custom-tab-btn" onclick="closeModal()">Close</button>
							</div>
						</div>
					</div>
				</div>

				<!-- Custom Alert Popup -->
				<div id="customAlert" class="custom-alert-overlay">
					<div class="custom-alert-box">
						<div class="custom-alert-header">BRRS</div>
						<div class="custom-alert-body">
							<p id="customAlertMessage" style="margin: 0;">Alert message</p>
						</div>
						<div class="custom-alert-footer">
							<button type="button" class="custom-alert-btn" onclick="closeCustomAlert()">OK</button>
						</div>
					</div>
				</div>

			</div>
		</div>
	</div>
</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BRRS - OTP Verification</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #1b2a49, #2f4b7c);
    }
    .card {
      width: 420px;
      max-width: 92%;
      background: #f7f7f7;
      border-radius: 4px;
      padding: 32px 36px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    .card img { height: 70px; margin-bottom: 8px; }
    h3 { margin: 8px 0 6px; color: #222; }
    p.info { margin: 0 0 18px; color: #555; font-size: 14px; }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      font-size: 22px;
      letter-spacing: 8px;
      text-align: center;
      border: 1px solid #c8d0e0;
      border-radius: 4px;
      background: #eef2fc;
    }
    .error { color: #b3003c; font-size: 14px; margin: 12px 0 0; }
    .btn {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      border: none;
      border-radius: 4px;
      background: #6b8fa3;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn:hover { background: #587a8e; }
    .link-btn {
      margin-top: 14px;
      background: none;
      border: none;
      color: #2a5db0;
      font-size: 14px;
      cursor: pointer;
      text-decoration: underline;
    }
    .back { display: block; margin-top: 12px; font-size: 13px; color: #555; }
  </style>
</head>
<body>
  <div class="card">
    <img th:src="@{/images/logo.png}" alt="" onerror="this.style.display='none'">
    <h3>OTP Verification</h3>
    <p class="info">Enter the 6-digit code sent to your registered email. It is valid for 5 minutes.</p>

    <form th:action="@{/otp/verify}" method="post" autocomplete="off">
      <input type="text" name="otp" maxlength="6" pattern="\d{6}" inputmode="numeric"
             placeholder="------" required autofocus />
      <p class="error" th:if="${error}" th:text="${error}"></p>
      <button type="submit" class="btn">Verify</button>
    </form>

    <form th:action="@{/otp/resend}" method="post">
      <button type="submit" class="link-btn">Resend OTP</button>
    </form>

    <a class="back" th:href="@{/login}">Back to login</a>
  </div>
</body>
</html>

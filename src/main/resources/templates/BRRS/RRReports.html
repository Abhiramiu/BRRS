		// if logged user is a Checker, checker cannot modify, if user is maker , then maker cant download
		function Maker_Checker_Function() {
			$.ajax({
				url: "/BRRS/getUserRole",
				type: "GET",
				success: function (roleId) {

					if (roleId === "ADM-C" || roleId === "USR-C" || roleId === "USER-AUDIT") {
						const modifyBtn = document.getElementById("addRecord");
						if (modifyBtn) modifyBtn.style.display = "none";
					}

					if (roleId === "ADM-M" || roleId === "USR-M") {
						const button = document.getElementById("custom-tab-btnAdd");
						if (button) button.style.display = "none";
					}

				},
				error: function (err) {
					console.error("Error fetching role:", err);
				}
			});
		}

	<script>
		document.addEventListener("DOMContentLoaded", function () {
			const statusCells = document.querySelectorAll(".rpt-status");

			statusCells.forEach(cell => {
				const rptCode = cell.getAttribute("data-rptcode");

				fetch('checkDomainFlag?rptcode=' + rptCode)
					.then(response => response.text())
					.then(result => {
						if (result === 'ENABLED') {
							cell.textContent = 'Enabled';
							cell.style.color = 'green';
						} else if (result === 'DISABLED') {
							cell.textContent = 'Disabled';
							cell.style.color = 'red';
						} else {
							cell.textContent = 'Unknown';
							cell.style.color = 'gray';
						}
					})
					.catch(error => {
						console.error('Error fetching status for', rptCode, error);
						cell.textContent = 'Error';
						cell.style.color = 'orange';
					});
			});
		});

		function getVali(a) {
			var reportid = a.getAttribute("data-rptcode");
			var todate = a.getAttribute("data-todate");

			// Show loader
			$('#loader').modal('show');

			$.ajax({
				url: "checkDomainFlag?rptcode=" + reportid,
				type: "GET",
				success: function (response) {

					if (response === 'ENABLED') {
						$("#loader").modal("hide");
						location.href = 'BRRSValidations?rptcode=' + reportid + '&todate=' + todate;
					} else if (response === 'DISABLED') {
						alert('This report is disabled.');
					} else {
						alert('Report not found.');
					}
				},
				error: function (xhr, status, error) {
					$("#loader").modal("hide");

					console.error("Error:", error);
					alert("Error occurred: " + error);
				}
			});
		}

	</script>

<script>
	$(document).ready(function () {

		// inline !important so no stylesheet can override
		function force(el, props) {
			for (var k in props) { el.style.setProperty(k, props[k], 'important'); }
		}

		// Works with BOTH DataTables 1.x (.dataTables_filter / .dataTables_paginate)
		// and DataTables 2.x (.dt-search / .dt-paging)
		function arrange() {
			var filter = document.querySelector('.dataTables_filter, .dt-search');
			var pager = document.querySelector('.dataTables_paginate, .dt-paging');
			if (!filter || !pager) { return false; }

			force(filter, { 'float': 'none', 'margin': '0', 'padding': '0', 'text-align': 'right' });
			force(pager, { 'float': 'none', 'margin': '0', 'padding': '0', 'text-align': 'right', 'justify-content': 'flex-end' });

			document.getElementById('rptTopBar').appendChild(filter);   // search -> top right
			document.getElementById('rptPager').appendChild(pager);     // pagination -> bottom right

			// DataTables 2.x leaves empty layout rows behind - hide them
			document.querySelectorAll('.dt-layout-row').forEach(function (row) {
				if (!row.querySelector('table') && row.textContent.trim() === '') {
					row.style.display = 'none';
				}
			});
			return true;
		}

		try {
			// Create the DataTable only if nobody initialised it yet
			var tbl = document.getElementById('BRRSvalidation');
			if (tbl && !$.fn.dataTable.isDataTable(tbl)) {
				$(tbl).DataTable({
					"pageLength": 10,
					"paging": true,
					"info": false,
					"searching": true,
					"ordering": false,
					"lengthChange": false,
					"dom": 'frtp'
				});
			}
		} catch (e) {
			console.error(e);
		}

		// Wait (up to 5 seconds) until the controls exist, then move them
		var tries = 0;
		var timer = setInterval(function () {
			tries++;
			if (arrange() || tries > 50) { clearInterval(timer); }
		}, 100);
	});
</script>

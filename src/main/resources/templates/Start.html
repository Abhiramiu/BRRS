<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head>
<meta charset="utf-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRRS - Login</title>

<!-- Bootstrap & jQuery -->
<link rel="stylesheet" type="text/css"
	href="/webjars/bootstrap/4.3.1/css/bootstrap.css"
	th:href="@{/webjars/bootstrap/4.3.1/css/bootstrap.css}">
<script src="/webjars/jquery/3.4.1/jquery.js"
	th:src="@{/webjars/jquery/3.4.1/jquery.js}"></script>
<script src="/webjars/bootstrap/4.3.1/js/bootstrap.js"
	th:src="@{/webjars/bootstrap/4.3.1/js/bootstrap.js}"></script>

<!-- Favicon -->
<link rel="shortcut icon" th:href="@{/favicon.ico}" type="image/x-icon">
<link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

body {
	background-size: cover;
	background-position: center;
	background-repeat: no-repeat;
	height: 100vh;
	display: flex;
	align-items: center;
	justify-content: center;
	margin: 0;
}

.login-wrapper {
    width: 100%;
    max-width: 400px;
    padding: 15px;
}

.card-container {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border: none;
    border-radius: 12px;
    padding: 40px 35px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
    transition: transform 0.3s ease;
}

.profile-img-card {
    width: 180px;
    height: auto;
    margin: 0 auto 5px;
    display: block;
    object-fit: contain;
}

.profile-name-card {
    font-size: 20px;
    font-weight: 700;
    color: #333333;
    text-align: center;
    margin-bottom: 18px;
    letter-spacing: 0.5px;
}

.form-control {
    height: 48px;
    font-size: 15px;
    border-radius: 8px;
    border: 1px solid #ced4da;
    padding: 10px 15px;
    margin-bottom: 15px;
    transition: all 0.2s ease-in-out;
}

.form-control:focus {
    border-color: rgb(104, 145, 162);
    box-shadow: 0 0 0 3px rgba(104, 145, 162, 0.15);
    outline: none;
}


.btn-signin {
    background-color: rgb(104, 145, 162);
    border: none;
    border-radius: 8px;
    height: 48px;
    font-weight: 600;
    font-size: 16px;
    color: #ffffff;
    width: 100%;
    margin-top: 10px;
    cursor: pointer;
    transition: background-color 0.2s ease,
                transform 0.1s ease,
                box-shadow 0.2s ease;
}

.btn-signin:hover {
    background-color: #527789;
    box-shadow: 0 4px 10px rgba(82, 119, 137, 0.3);
    transform: translateY(-1px);
}

.btn-signin:active {
    background-color: #3F6475;
    transform: translateY(0);
}


.btn-signin:active {
    transform: scale(0.98);
}

.alert-message {
    font-size: 13px;
    text-align: center;
    margin-bottom: 15px;
    padding: 8px;
    border-radius: 6px;
}

.alert-error {
    color: #cd103c;
    background-color: rgba(205, 16, 60, 0.08);
}

.alert-logout {
    color: #34af32;
    background-color: rgba(52, 175, 50, 0.08);
}
</style>
</head>
<body th:style="'background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url(' + @{/images/bodyBG.jpg} + ');'">

    <div class="login-wrapper">
        <div class="card card-container">
            <!-- Logo -->
            <img id="profile-img" class="profile-img-card" th:src="@{/images/Login-Logo.png}" alt="BRRS Logo" />

            <!-- Title -->
            <p id="profile-name" class="profile-name-card">BRRS Portal</p>

            <!-- Login Form -->
            <form th:action="@{/login}" method="post" name="Login_Form" class="form-signin">
                
                <!-- Feedback Messages -->
                <div th:if="${param.error}" class="alert-message alert-error" th:text="${param.error}">Invalid credentials</div>
                
                <!-- User ID Field -->
                <div class="form-group">
                    <input type="text" onkeyup="this.value = this.value.toUpperCase();" 
                           class="form-control" name="userid" placeholder="User Id" id="userid" required autofocus>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <input type="password" class="form-control" name="password" placeholder="Password" id="password" required>
                </div>

                <!-- Submit Button -->
                <button class="btn btn-signin" type="submit">Sign In</button>
            </form>
        </div>
    </div>

</body>
</html>
